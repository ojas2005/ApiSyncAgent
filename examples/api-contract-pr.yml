# Copy to .github/workflows/api-contract.yml in the full-stack repository.
# Adjust BACKEND_DIR, FRONTEND_DIR, and TYPES_OUT for that repository.
name: API contract check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ./tools/api-contract-agent
      - name: Compare response contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BACKEND_DIR: backend
          FRONTEND_DIR: frontend/src
          TYPES_OUT: frontend/src/generated/api-contracts.ts
        run: |
          api-contract-sync check \
            --backend "$BACKEND_DIR" \
            --frontend "$FRONTEND_DIR" \
            --base-ref "$BASE_SHA" \
            --types-out "$TYPES_OUT" \
            --verify-types \
            --report api-contract-report.md
      - name: Publish checklist summary
        if: always()
        run: |
          if [ -f api-contract-report.md ]; then
            cat api-contract-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
